# Use a local H2 file so admin changes persist between restarts
spring.datasource.url=jdbc:h2:file:./data/fisiodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL statements in the console for debugging
spring.jpa.show-sql=true

# Keep the schema and data between restarts
spring.jpa.hibernate.ddl-auto=update

# Server port for backend (allows overriding via SERVER_PORT env var)
server.port=8092

# Public frontend URL used in account activation emails
app.frontend.url=http://localhost:8080

