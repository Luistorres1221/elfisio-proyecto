# Use H2 in-memory for Railway (data resets on restart)
spring.datasource.url=jdbc:h2:mem:fisiodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL statements in the console for debugging
spring.jpa.show-sql=true

# Keep the schema and data between restarts
spring.jpa.hibernate.ddl-auto=update

# Server port - Railway assigns PORT env var automatically
server.port=${PORT:8092}

# Public frontend URL used in account activation emails
app.frontend.url=https://elfisio-proyecto.vercel.app

